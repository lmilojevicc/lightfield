version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # svelte-check 4.7.6 supports TS 5/6; TS 7 lacks its required legacy compiler API.
    # Revisit with Svelte and typescript-eslint support; keep TS 6 updates enabled.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
